<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">数字交互文创方案板预置示意图</title>
  <desc id="description">用自创抽象纹样说明文化意图、参与动作与反馈关系的演示方案板。</desc>
  <defs>
    <style>
      .sans { font-family: "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif; }
      .serif { font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", serif; }
      .ink { fill: #23201C; }
      .muted { fill: #23201C; opacity: .62; }
      .line { stroke: #D6D0C4; stroke-width: 2; fill: none; }
      .fine { stroke: #23201C; stroke-width: 2; fill: none; }
      .accent-stroke { stroke: #B23A2F; stroke-width: 4; fill: none; }
      .accent-fill { fill: #B23A2F; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L10 6L1 11" class="fine"/>
    </marker>
    <pattern id="motif" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M0 40H80M40 0V80M12 12L68 68M68 12L12 68" class="line"/>
      <circle cx="40" cy="40" r="17" fill="#EEEAE1" stroke="#23201C" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="#EEEAE1"/>
  <path d="M64 144H1536" class="line"/>
  <text x="64" y="72" class="sans muted" font-size="18" letter-spacing="3">LUMI / DEMONSTRATION ASSET 01</text>
  <text x="64" y="124" class="serif ink" font-size="42" font-weight="700">数字交互文创方案板</text>
  <rect x="1248" y="54" width="288" height="70" rx="35" fill="#B23A2F"/>
  <text x="1392" y="99" class="sans" font-size="28" font-weight="700" fill="#EEEAE1" text-anchor="middle">预置示意图</text>

  <text x="64" y="206" class="sans muted" font-size="17" letter-spacing="2">01 / 文化意图</text>
  <text x="558" y="206" class="sans muted" font-size="17" letter-spacing="2">02 / 参与动作</text>
  <text x="1052" y="206" class="sans muted" font-size="17" letter-spacing="2">03 / 反馈关系</text>

  <rect x="64" y="232" width="438" height="472" rx="6" fill="none" stroke="#D6D0C4" stroke-width="2"/>
  <rect x="96" y="264" width="374" height="244" fill="url(#motif)"/>
  <rect x="96" y="264" width="374" height="244" fill="none" stroke="#23201C" stroke-width="2"/>
  <circle cx="283" cy="386" r="78" fill="#EEEAE1" stroke="#B23A2F" stroke-width="4"/>
  <path d="M233 386C250 348 316 348 333 386C316 424 250 424 233 386Z" class="fine"/>
  <circle cx="283" cy="386" r="10" class="accent-fill"/>
  <text x="96" y="562" class="serif ink" font-size="31" font-weight="700">让被忽略的纹样</text>
  <text x="96" y="606" class="serif ink" font-size="31" font-weight="700">因人的靠近而显现</text>
  <text x="96" y="658" class="sans muted" font-size="18">自创抽象纹样，不对应具体文物图像</text>

  <rect x="558" y="232" width="438" height="472" rx="6" fill="none" stroke="#D6D0C4" stroke-width="2"/>
  <path d="M620 320H934" class="line"/>
  <path d="M620 454H934" class="line"/>
  <path d="M620 588H934" class="line"/>
  <circle cx="660" cy="320" r="26" fill="none" stroke="#23201C" stroke-width="2"/>
  <path d="M660 346V388M630 410C646 378 674 378 690 410M642 292C642 266 678 266 678 292" class="fine"/>
  <circle cx="660" cy="454" r="58" fill="none" stroke="#B23A2F" stroke-width="4" stroke-dasharray="10 10"/>
  <circle cx="660" cy="454" r="26" fill="none" stroke="#23201C" stroke-width="2"/>
  <path d="M660 480V522M630 544C646 512 674 512 690 544" class="fine"/>
  <circle cx="660" cy="588" r="26" fill="none" stroke="#23201C" stroke-width="2"/>
  <path d="M660 614V656M630 678C646 646 674 646 690 678" class="fine"/>
  <text x="758" y="311" class="sans ink" font-size="25" font-weight="700">看见界面处于待机</text>
  <text x="758" y="342" class="sans muted" font-size="17">尚未出现参与提示</text>
  <text x="758" y="445" class="sans ink" font-size="25" font-weight="700">自然靠近展墙</text>
  <text x="758" y="476" class="sans muted" font-size="17">距离变化成为输入</text>
  <text x="758" y="579" class="sans ink" font-size="25" font-weight="700">停留并观察反馈</text>
  <text x="758" y="610" class="sans muted" font-size="17">无需先阅读操作说明</text>

  <rect x="1052" y="232" width="484" height="472" rx="6" fill="none" stroke="#D6D0C4" stroke-width="2"/>
  <rect x="1090" y="272" width="408" height="292" fill="url(#motif)" opacity=".34"/>
  <path d="M1128 508C1196 430 1262 486 1320 402C1360 346 1414 362 1460 316" class="accent-stroke"/>
  <circle cx="1128" cy="508" r="9" class="accent-fill"/>
  <circle cx="1320" cy="402" r="9" class="accent-fill"/>
  <circle cx="1460" cy="316" r="9" class="accent-fill"/>
  <text x="1090" y="612" class="sans ink" font-size="25" font-weight="700">靠近越明确，纹样显影越完整</text>
  <text x="1090" y="650" class="sans muted" font-size="18">反馈紧跟动作，不把说明文字当作唯一线索</text>

  <text x="64" y="768" class="sans muted" font-size="17" letter-spacing="2">04 / 可验证的关系链</text>
  <path d="M262 844H422M566 844H726M870 844H1030M1174 844H1334" class="fine" marker-end="url(#arrow)"/>
  <g class="sans" font-size="21" text-anchor="middle">
    <rect x="64" y="802" width="198" height="84" rx="42" fill="none" stroke="#23201C" stroke-width="2"/>
    <text x="163" y="852" class="ink">距离输入</text>
    <rect x="422" y="802" width="144" height="84" rx="42" fill="none" stroke="#23201C" stroke-width="2"/>
    <text x="494" y="852" class="ink">映射</text>
    <rect x="726" y="802" width="144" height="84" rx="42" fill="none" stroke="#23201C" stroke-width="2"/>
    <text x="798" y="852" class="ink">显影</text>
    <rect x="1030" y="802" width="144" height="84" rx="42" fill="none" stroke="#23201C" stroke-width="2"/>
    <text x="1102" y="852" class="ink">说明</text>
    <rect x="1334" y="802" width="202" height="84" rx="42" fill="none" stroke="#B23A2F" stroke-width="4"/>
    <text x="1435" y="852" class="ink">同伴验证</text>
  </g>

  <path d="M64 930H1536" class="line"/>
  <text x="64" y="966" class="sans muted" font-size="16">自创矢量 · 不含实拍、拓片或学生提交物 · 仅用于演示设计关系</text>
  <text x="1536" y="966" class="sans muted" font-size="16" text-anchor="end">DEMONSTRATION_DATA</text>
</svg>
