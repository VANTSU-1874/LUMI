<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">待机靠近反馈三状态预置示意图</title>
  <desc id="description">以三幅自创抽象图形展示距离互动从待机到反馈的状态变化。</desc>
  <defs>
    <style>
      .sans { font-family: "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif; }
      .serif { font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", serif; }
      .ink { fill: #23201C; }
      .muted { fill: #23201C; opacity: .58; }
      .line { stroke: #D6D0C4; stroke-width: 2; fill: none; }
      .fine { stroke: #23201C; stroke-width: 2; fill: none; }
      .accent { stroke: #B23A2F; stroke-width: 5; fill: none; }
    </style>
    <pattern id="grid" width="58" height="58" patternUnits="userSpaceOnUse">
      <path d="M0 29H58M29 0V58" class="line"/>
      <circle cx="29" cy="29" r="10" fill="#EEEAE1" stroke="#23201C" stroke-width="1.5"/>
    </pattern>
    <clipPath id="approach-reveal"><circle cx="800" cy="438" r="146"/></clipPath>
    <clipPath id="feedback-reveal"><circle cx="1304" cy="438" r="222"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="#EEEAE1"/>
  <text x="64" y="70" class="sans muted" font-size="18" letter-spacing="3">LUMI / INTERACTION STATES</text>
  <text x="64" y="126" class="serif ink" font-size="42" font-weight="700">靠近之后，画面如何回应</text>
  <rect x="1248" y="50" width="288" height="70" rx="35" fill="#B23A2F"/>
  <text x="1392" y="95" class="sans" font-size="28" font-weight="700" fill="#EEEAE1" text-anchor="middle">预置示意图</text>
  <path d="M64 156H1536" class="line"/>

  <g>
    <rect x="64" y="214" width="464" height="492" rx="6" fill="none" stroke="#D6D0C4" stroke-width="2"/>
    <text x="96" y="258" class="sans muted" font-size="16" letter-spacing="2">STATE 01</text>
    <text x="96" y="306" class="serif ink" font-size="34" font-weight="700">待机</text>
    <rect x="96" y="342" width="400" height="270" fill="url(#grid)" opacity=".16"/>
    <circle cx="296" cy="477" r="86" fill="#EEEAE1" stroke="#D6D0C4" stroke-width="3"/>
    <circle cx="296" cy="477" r="16" fill="#23201C" opacity=".42"/>
    <text x="96" y="657" class="sans ink" font-size="20">低对比 · 保留安静的视觉线索</text>
  </g>

  <g>
    <rect x="568" y="214" width="464" height="492" rx="6" fill="none" stroke="#D6D0C4" stroke-width="2"/>
    <text x="600" y="258" class="sans muted" font-size="16" letter-spacing="2">STATE 02</text>
    <text x="600" y="306" class="serif ink" font-size="34" font-weight="700">靠近</text>
    <rect x="600" y="342" width="400" height="270" fill="url(#grid)" opacity=".16"/>
    <g clip-path="url(#approach-reveal)">
      <rect x="600" y="342" width="400" height="270" fill="url(#grid)"/>
    </g>
    <circle cx="800" cy="477" r="146" class="accent" stroke-dasharray="12 12"/>
    <circle cx="800" cy="477" r="16" fill="#B23A2F"/>
    <text x="600" y="657" class="sans ink" font-size="20">局部显影 · 动作与变化同一时刻发生</text>
  </g>

  <g>
    <rect x="1072" y="214" width="464" height="492" rx="6" fill="none" stroke="#D6D0C4" stroke-width="2"/>
    <text x="1104" y="258" class="sans muted" font-size="16" letter-spacing="2">STATE 03</text>
    <text x="1104" y="306" class="serif ink" font-size="34" font-weight="700">反馈</text>
    <rect x="1104" y="342" width="400" height="270" fill="url(#grid)" opacity=".16"/>
    <g clip-path="url(#feedback-reveal)">
      <rect x="1104" y="342" width="400" height="270" fill="url(#grid)"/>
    </g>
    <circle cx="1304" cy="477" r="98" fill="#EEEAE1" stroke="#B23A2F" stroke-width="5"/>
    <path d="M1245 477C1269 426 1339 426 1363 477C1339 528 1269 528 1245 477Z" class="fine"/>
    <circle cx="1304" cy="477" r="13" fill="#B23A2F"/>
    <text x="1104" y="657" class="sans ink" font-size="20">完整显影 · 给出短说明并等待停留</text>
  </g>

  <path d="M528 438H568M1032 438H1072" stroke="#23201C" stroke-width="2"/>
  <path d="M550 428L566 438L550 448M1054 428L1070 438L1054 448" class="fine"/>
  <path d="M64 766H1536" class="line"/>
  <text x="64" y="808" class="sans ink" font-size="21">验证问题：</text>
  <text x="176" y="808" class="sans muted" font-size="21">不讲解时，体验者能否发现“靠近”与“显影”之间的关系？</text>
  <text x="64" y="854" class="sans muted" font-size="16">自创矢量 · 预置状态流程 · 不作为软件界面或课堂记录</text>
  <text x="1536" y="854" class="sans muted" font-size="16" text-anchor="end">DEMONSTRATION_DATA</text>
</svg>
