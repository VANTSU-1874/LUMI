<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1400" viewBox="0 0 1000 1400" role="img" aria-labelledby="title description">
  <title id="title">版式海报修改前预置示意图</title>
  <desc id="description">使用自创文字内容演示信息层级尚未建立的版式。</desc>
  <defs>
    <style>
      .sans { font-family: "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif; }
      .serif { font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", serif; }
      .ink { fill: #23201C; }
      .muted { fill: #23201C; opacity: .58; }
      .line { stroke: #D6D0C4; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect width="1000" height="1400" fill="#EEEAE1"/>
  <text x="58" y="62" class="sans muted" font-size="17" letter-spacing="3">LAYOUT STUDY / BEFORE</text>
  <rect x="678" y="28" width="264" height="62" rx="31" fill="#B23A2F"/>
  <text x="810" y="68" class="sans" font-size="24" font-weight="700" fill="#EEEAE1" text-anchor="middle">预置示意图</text>
  <path d="M58 108H942" class="line"/>

  <text x="82" y="208" class="sans ink" font-size="54" font-weight="500">纹样如何回应靠近</text>
  <text x="514" y="286" class="sans ink" font-size="49" font-weight="500" text-anchor="middle">互动设计开放课</text>
  <text x="124" y="368" class="sans ink" font-size="45">07.31</text>
  <text x="472" y="366" class="sans ink" font-size="42">14:00</text>
  <text x="760" y="366" class="sans ink" font-size="40">A-204</text>
  <path d="M86 432H916" class="line"/>

  <g fill="none" stroke="#23201C" stroke-width="2">
    <circle cx="300" cy="686" r="164"/>
    <circle cx="300" cy="686" r="118"/>
    <circle cx="300" cy="686" r="72"/>
    <rect x="518" y="536" width="312" height="312" transform="rotate(9 674 692)"/>
    <path d="M545 565L802 820M803 566L546 819"/>
  </g>
  <circle cx="300" cy="686" r="23" fill="#B23A2F"/>

  <text x="90" y="954" class="sans ink" font-size="34">从距离输入到纹样显影</text>
  <text x="476" y="1008" class="sans ink" font-size="34">一次面向初学者的案例拆解</text>
  <text x="112" y="1080" class="sans ink" font-size="32">观察</text>
  <text x="292" y="1080" class="sans ink" font-size="32">动作</text>
  <text x="494" y="1080" class="sans ink" font-size="32">反馈</text>
  <text x="692" y="1080" class="sans ink" font-size="32">验证</text>
  <text x="84" y="1170" class="sans muted" font-size="24">预置案例 / 自创图形 / 仅用于版式前后对照</text>
  <path d="M58 1288H942" class="line"/>
  <text x="58" y="1335" class="sans ink" font-size="22">对照 A：字号接近、对齐关系分散，阅读入口不明确</text>
  <text x="942" y="1335" class="sans muted" font-size="17" text-anchor="end">DEMONSTRATION_DATA</text>
</svg>
